name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test
    # `macos-14` ships Swift 5.10, which cannot open a tools-version 6.0
    # manifest — the job died at the first command with "installed version is
    # 5.10.0". `macos-15` ships Swift 6, and the FoundationModels API is behind
    # `#if canImport`, so the older SDK is not a problem.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The runner's default Xcode is 16.4 (SDK 15.5, Swift 6.1). The vendored
      # SwiftTerm uses isolated conformances (`@MainActor Protocol` in an
      # inheritance clause), which is Swift 6.2 syntax; under 16.4 it fails
      # with "unknown attribute 'MainActor'" and 1,597 follow-on errors. Pin the
      # newest Xcode on the image instead of inheriting whatever is default.
      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          # The vendored SwiftTerm package is part of the tree, so its manifest
          # has to be in the key. Without it, changing how that package is
          # compiled left a stale module in the cache and CI kept reporting the
          # errors the change had already fixed.
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift', 'Packages/SwiftTerm/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Both `-warnings-as-errors` and `-strict-concurrency=complete` are
      # declared per target in `Package.swift`, where they reach only
      # first-party code — a `-Xswiftc` flag on the command line applies to
      # every target in the graph, including the vendored SwiftTerm, which is
      # Swift 5 code that cannot satisfy them (that once produced 1,050 errors
      # in a dependency nobody was editing). A command-line flag is also part
      # of the build fingerprint, so one invocation without it re-dirties the
      # entire graph — SwiftTerm included — and the next flagged build
      # recompiles it from scratch. Never pass build flags here.
      - name: Build (warnings as errors)
        run: swift build --disable-sandbox

      # Tests are NOT run with `-warnings-as-errors`: test code legitimately
      # uses constructs (force-unwrapping fixtures, unused bindings) that the
      # product code must not.
      - name: Test
        run: swift test --disable-sandbox --no-parallel

      - name: Release build
        run: swift build -c release --disable-sandbox

      # A test run must not write into the user's real plugin sandbox. This
      # caught a regression once already: `PurahPluginFileStorage` defaulted to
      # Application Support even under test, leaving ~190 stray directories.
      - name: Verify tests did not touch real app data
        run: |
          REAL_DIR="$HOME/Library/Application Support/Purah/Plugins"
          if [ -d "$REAL_DIR" ]; then
            echo "Unexpected: tests wrote to $REAL_DIR"
            ls -la "$REAL_DIR" | head -20
            exit 1
          fi
          echo "OK: no real plugin sandbox created"
